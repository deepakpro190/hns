name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Setup Docker
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 3. Build Docker image
    - name: Build Docker Image
      run: docker build -t sales-api .

    # 4. Run container
    - name: Run Container
      run: docker run -d -p 8000:8000 sales-api

    # 5. Wait for app to start
    - name: Wait for server
      run: sleep 10

    # 6. Test API
    - name: Test API
      run: curl http://localhost:8000
